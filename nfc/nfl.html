<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 800px;
    height: 450px;
  }
  .stage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    height: 140px;
    background: #ff0000;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: pulse 1s infinite;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  .play-btn::after {
    content: '';
    width: 0;
    height: 0;
    border-left: 50px solid #fff;
    border-top: 30px solid transparent;
    border-bottom: 30px solid transparent;
    margin-left: 12px;
  }
  .watch-now {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff0000;
    color: #fff;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 40px;
    padding: 15px 40px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 15px;
    animation: fade 1s infinite alternate;
  }
  .watch-now .mini-play {
    width: 40px;
    height: 40px;
    background: #fff;
    border-radius: 50%;
    position: relative;
  }
  .watch-now .mini-play::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-40%, -50%);
    width: 0;
    height: 0;
    border-left: 14px solid #ff0000;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
  }
  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
  }
  @keyframes fade {
    from { opacity: 0.7; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage">
    <img src="118992950.avif" alt="NFL">
    <div class="play-btn"></div>
    <div class="watch-now">
      <div class="mini-play"></div>
      WATCH NOW
    </div>
  </div>
</body>
</html>
